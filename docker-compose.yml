services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modelbridge
      POSTGRES_PASSWORD: modelbridge
      POSTGRES_DB: modelbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://modelbridge:modelbridge@postgres:5432/modelbridge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-use-a-long-random-string
      ENCRYPTION_KEY: change-me-generate-with-fernet-generate-key
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://modelbridge:modelbridge@postgres:5432/modelbridge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-use-a-long-random-string
      ENCRYPTION_KEY: change-me-generate-with-fernet-generate-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

volumes:
  postgres_data:
  ollama_data:
