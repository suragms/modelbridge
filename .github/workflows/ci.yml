name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelbridge
          POSTGRES_PASSWORD: modelbridge
          POSTGRES_DB: modelbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          cd apps/api
          ruff check .

      - name: Ruff format check
        run: |
          cd apps/api
          ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://modelbridge:modelbridge@localhost:5432/modelbridge
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: test-encryption-key
        run: |
          cd apps/api
          python -m pytest tests/ -v --tb=short

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t modelbridge-api .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t modelbridge-web .
