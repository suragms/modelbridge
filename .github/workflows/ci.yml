name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelbridge
          POSTGRES_PASSWORD: modelbridge
          POSTGRES_DB: modelbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          cd apps/api
          ruff check .

      - name: Ruff format check
        run: |
          cd apps/api
          ruff format --check .

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://modelbridge:modelbridge@localhost:5432/modelbridge
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: test-encryption-key
        run: |
          cd apps/api
          python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build
        run: |
          cd apps/web
          npm ci
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip audit (API)
        continue-on-error: true
        run: |
          cd apps/api
          pip install pip-audit
          pip install -e .
          pip-audit

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t modelbridge-api .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t modelbridge-web .

  cli-and-sdk:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test CLI
        run: |
          pip install -e packages/cli pytest
          pytest packages/cli/tests/ -q

      - name: Test Python SDK
        run: |
          pip install -e packages/python-sdk respx pytest
          pytest packages/python-sdk/tests/ -q

      - name: Build TypeScript SDK
        run: |
          cd packages/typescript-sdk
          npm install
          npm run build
